name: Deploy Link Manager to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['link-manager/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: link-manager/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: link-manager

      - name: Build
        run: npm run build
        working-directory: link-manager

      - uses: actions/upload-pages-artifact@v3
        with:
          path: link-manager/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
